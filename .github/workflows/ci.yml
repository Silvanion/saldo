name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & Integration tests (Vitest + coverage thresholds)
        run: npm run test:coverage

      # Emulator Firestore (firebase-tools 15) wymaga Javy 21+.
      - name: Set up Java (emulator Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

      - name: Build production bundle
        run: npm run build

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: E2E tests on production build (CSP)
        run: npm run test:e2e:prod

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    name: Electron (real app + packaged fuses)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Electron 44 nie ma już postinstall — binarkę trzeba pobrać jawnie.
      - name: Download Electron binary
        run: npx install-electron

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build web bundle
        run: npm run build

      - name: Electron e2e (dev launch)
        run: npm run test:e2e:electron -- e2e-electron/electron.spec.ts

      - name: Package unpacked Linux app
        run: npx electron-builder --linux dir --publish never

      - name: Electron e2e (packaged binary, fuses)
        env:
          SALDO_PACKAGED_BIN: ${{ github.workspace }}/dist-electron/linux-unpacked/saldo-app
        run: npm run test:e2e:electron -- e2e-electron/packaged.spec.ts
