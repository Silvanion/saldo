name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# electron-builder's own `--publish always` GitHub integration has two
# distinct races that both produced duplicate draft releases for the same
# tag in practice:
#   1. Cross-job: macOS and Windows running as parallel matrix jobs each
#      independently checked "does a release exist yet?" at nearly the same
#      time. Fixed by making windows depend on macos (sequential `needs:`).
#   2. Intra-job: even within a single job, electron-builder uploads an
#      artifact and its .blockmap in parallel; on the very first upload for
#      a tag (no release exists yet), both parallel uploads raced the same
#      "create release" check and created two separate releases anyway —
#      this recurred despite fix #1.
# Root cause of #2 is inside electron-builder's own publish step, not this
# workflow, so instead of chasing more scheduling tweaks we sidestep it
# entirely: electron-builder only builds (`--publish never`), and release
# creation/upload is done ourselves via `gh release`, one deterministic
# step at a time — no hidden concurrency left to race.
jobs:
  release-macos:
    name: Build & Publish (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and embedded server
        run: npm run build

      - name: Build Electron App
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_SECRET" ]; then
            export CSC_LINK="$CSC_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_SECRET"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish never

      - name: Create GitHub Release and upload macOS artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft --title "Saldo ${{ github.ref_name }}" \
            --notes "Automatyczny build — opis wydania zostanie zaktualizowany ręcznie." \
            --repo "${{ github.repository }}" \
            || echo "Release for this tag already exists, continuing"
          gh release upload "${{ github.ref_name }}" \
            dist-electron/*.dmg dist-electron/*.zip dist-electron/*.blockmap dist-electron/latest-mac.yml \
            --repo "${{ github.repository }}" --clobber

  release-windows:
    name: Build & Publish (windows-latest)
    needs: release-macos
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and embedded server
        run: npm run build

      - name: Build Electron App
        shell: bash
        env:
          WIN_CSC_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_SECRET" ]; then
            export WIN_CSC_LINK="$WIN_CSC_SECRET"
            export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_SECRET"
          fi
          npx electron-builder --publish never

      - name: Upload Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist-electron/*.exe dist-electron/*.blockmap dist-electron/latest.yml \
            --repo "${{ github.repository }}" --clobber
