name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# electron-builder --publish always creates the GitHub Release for this tag
# if it doesn't exist yet. Running macOS and Windows as matrix jobs (the
# previous setup) let both runners start that "does a release exist?" check
# at nearly the same time, so both created their own separate draft release
# for the same tag — assets split across two duplicates instead of landing
# in one. Making windows depend on macos forces them to run in sequence:
# macos creates the release, windows finds and uploads into the one that
# already exists.
jobs:
  release-macos:
    name: Build & Publish (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and embedded server
        run: npm run build

      - name: Build & Publish Electron Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_SECRET" ]; then
            export CSC_LINK="$CSC_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_SECRET"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish always

  release-windows:
    name: Build & Publish (windows-latest)
    needs: release-macos
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and embedded server
        run: npm run build

      - name: Build & Publish Electron Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_SECRET" ]; then
            export WIN_CSC_LINK="$WIN_CSC_SECRET"
            export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_SECRET"
          fi
          npx electron-builder --publish always
